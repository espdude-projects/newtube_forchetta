services:
  - type: web
    name: newtube
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app # Ersetze 'app:app' falls deine Startdatei anders heißt (z.B. main:app)
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0 # Oder deine bevorzugte Python-Version
