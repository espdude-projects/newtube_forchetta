# Render.com Blueprint — NewTube server, free tier, 1-click deploy.
#
# Free tier: 750h/month, sleeps after 15 min inactivity, ~30s cold start.
# For always-on, upgrade to $7/mo plan.
#
# IMPORTANT: The Python runtime on Render is read-only, so we cannot apt-get
# install ffmpeg.  The server is designed to work without ffmpeg by
# preferring YouTube's native H.264 progressive MP4 streams.  If a
# particular video is only available in VP9/AV1, the server will respond
# with 415 Unsupported Media Type for that video.

services:
  - type: web
    name: newtube
    runtime: python
    plan: free
    pythonVersion: 3.11.9
    buildCommand: "pip install --upgrade pip && pip install -r server/requirements.txt"
    startCommand: "cd server && PYTHONUNBUFFERED=1 NEWTUBE_PORT=$PORT python3 -m uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: NEWTUBE_HEIGHT
        value: "720"
      - key: NEWTUBE_FPS
        value: "30"
      - key: NEWTUBE_INSECURE_TLS
        value: "0"
      - key: YOUTUBE_API_KEY
        sync: false
        optional: true
      - key: NEWTUBE_COOKIES
        sync: false
        optional: true
      - key: NEWTUBE_NOCHECKCERT
        value: "0"
    healthCheckPath: /api/version
    autoDeploy: true
