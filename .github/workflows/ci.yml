name: Build widget

on:
  push:
    paths:
      - 'widget/src/**'
      - 'widget/package.json'
      - 'widget/webpack.config.js'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  build-widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: widget/package-lock.json
      - name: Install
        working-directory: widget
        run: npm install
      - name: Build
        working-directory: widget
        run: npm run build
      - name: Package
        run: |
          cd widget
          node ../scripts/package-widget.js
      - name: Commit rebuilt widget
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add widget/dist dist/widgetlist.xml dist/widget-install/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: rebuild widget bundle"
            git push
          fi
